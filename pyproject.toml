[project]
name = "cc-switch-enhanced"
dynamic = ["version"]
description = "One-line model-name switch across many coding agents (aggregator-API friendly)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "tony" }]
keywords = ["cli", "llm", "agent", "model-switch", "newapi", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["tomlkit>=0.12", "ruamel.yaml>=0.18", "tomli-w>=0.4"]

[project.urls]
Homepage = "https://github.com/tonykw12/cc-switch-enhanced"

[project.scripts]
ccse = "ccse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ccse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ccse"]